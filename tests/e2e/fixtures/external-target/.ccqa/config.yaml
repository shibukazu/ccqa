defaultTarget: todo-e2e
targets:
  todo-e2e:
    kind: external
    framework: playwright
    testPath: specs/{case}.spec.ts
    writeRoots:
      - pages
    resources:
      - path: pages
        description: page objects, one per screen
    conventions:
      guides:
        - docs/e2e-guidelines.md
    cases: ./ccqa/cases.mjs
    header: |
      // case: {case}
      // source: {link.url}
    titleTags:
      field: priority
      map:
        high: smoke
      format: "@{value}"
    runId:
      import: 'import { generateRunId } from "../utils/run-id";'
      expression: "generateRunId()"
