defaultTarget: app-e2e

envFiles:
  - .env.test

targets:
  app-e2e:
    kind: external
    framework: playwright
    testPath: specs/{case}.spec.ts
    cases: ./ccqa/cases.mjs
    runId:
      import: 'import { runId } from "../../support/run-id";'
      expression: "runId()"
    runCommand: "node support/fake-runner.mjs {files}"
