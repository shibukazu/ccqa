name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Dry run (skip npm publish and git push)"
        type: boolean
        required: false
        default: false
      hub_impact_override:
        description: "Release even though the diff disagrees with the bump — say why (printed in the job summary and the release notes)"
        type: string
        required: false
        default: ""

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      BUMP: ${{ inputs.bump }}
      DRY_RUN: ${{ inputs.dry_run }}
      OVERRIDE: ${{ inputs.hub_impact_override }}
      NOTES: release-notes.md
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      # Before the bump, so the diff it reads is the release's own changes and
      # not the `chore: release` commit. Before the build, so a bump the diff
      # contradicts fails in seconds rather than after the full suite.
      - name: Classify hub impact
        run: |
          node --experimental-strip-types src/release/check.ts \
            --bump "$BUMP" --override "$OVERRIDE" --notes-out "$NOTES"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build dist/
        run: pnpm build

      - name: Run tests
        run: pnpm test

      # The instrumentation SDK moves in lockstep with the CLI. The two agree on
      # a wire format that only this repository tests, so "which SDK goes with
      # which CLI" has to have an answer, and the same number is the only one
      # nobody has to look up. Genuine skew — an application on an older SDK —
      # is what the push payload's `protocol` field is for.
      - name: Bump version
        id: bump
        run: |
          new_version=$(pnpm version "$BUMP" --no-git-tag-version)
          pnpm --filter ccqa-coverage exec npm version "${new_version#v}" --no-git-tag-version
          echo "version=${new_version}" >> "$GITHUB_OUTPUT"
          echo "Bumped to ${new_version}"

      - name: Rebuild dist/ with bumped version
        run: pnpm build

      - name: Commit and tag
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git add package.json packages/coverage/package.json
          git commit -m "chore: release ${VERSION}"
          git tag "${VERSION}"

      - name: Push to main
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git push origin HEAD:main
          git push origin "${VERSION}"

      # IMPORTANT: invoke npm via `npx -y npm@latest`, not the bundled
      # npm that ships with the runner's Node toolchain. npm Trusted
      # Publishers (OIDC) requires npm 11.5+; the runner ships npm
      # 10.9.7, which does not propagate the OIDC token in the form the
      # registry expects and PUTs return E404. v0.1.x releases worked
      # because that workflow used `npx -y npm@latest publish` directly.
      - name: Publish to npm (trusted publishing + provenance)
        if: ${{ env.DRY_RUN != 'true' }}
        run: npx -y npm@latest publish --provenance --access public

      # After the CLI, so a registry that has not been told about the scoped
      # package yet costs the SDK's release and not the CLI's. The SDK installs
      # into the application under test, which is a different tree from the one
      # the CLI runs in — it cannot ship as a subpath of `ccqa`.
      - name: Publish ccqa-coverage to npm
        if: ${{ env.DRY_RUN != 'true' }}
        working-directory: packages/coverage
        run: |
          pnpm build
          npx -y npm@latest publish --provenance --access public

      # After publishing: a release that npm rejected should not be announced.
      # The hub-impact answer leads the body — it is what the person holding a
      # deployed hub has to act on — and gh appends the generated changelog.
      - name: Create GitHub Release
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: gh release create "$VERSION" --title "$VERSION" --notes-file "$NOTES" --generate-notes

      - name: Dry-run publish
        if: ${{ env.DRY_RUN == 'true' }}
        run: npx -y npm@latest publish --dry-run --access public

      - name: Dry-run publish ccqa-coverage
        if: ${{ env.DRY_RUN == 'true' }}
        working-directory: packages/coverage
        run: |
          pnpm build
          npx -y npm@latest publish --dry-run --access public
