title: >-
  the shared fetch layer changes — every spec that signs in goes through it,
  and only the static help page does not
mutations:
  - file: public/js/api.js
    search: 'const headers = { "content-type": "application/json" };'
    replace: 'const headers = { "content-type": "application/json", accept: "application/json" };'
expect:
  select:
    auth/login: needed
    tasks/add-task: needed
    tasks/complete-task: needed
    tasks/filter-tasks: needed
    help/read-help: notNeeded
