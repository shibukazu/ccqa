# The PATCH /api/tasks/:id handler is exercised by the two specs that toggle
# a checkbox; adding tasks and signing in use other endpoints.
title: >-
  one API endpoint's handler changes — the specs exercising it are needed,
  the rest are not
mutations:
  - file: backend/routes/tasks.mjs
    search: |-
      const done = validDone(body);
          if (done !== null) task.done = done;
          sendJson(res, 200, { task });
    replace: |-
      const done = validDone(body);
          if (done === null) {
            sendJson(res, 400, { error: "done must be a boolean" });
            return true;
          }
          task.done = done;
          sendJson(res, 200, { task });
expect:
  select:
    tasks/complete-task: needed
    tasks/filter-tasks: needed
    auth/login: notNeeded
    tasks/add-task: notNeeded
    help/read-help: notNeeded
