# Backend-only diff; the judgement is tracing it through api.js to every flow
# that POSTs a title, whose data ("Buy milk", 8 chars) the product now refuses.
# The rule is deliberate — check plus message — so this is SPEC_CHANGE/
# BEHAVIOUR_CHANGED, not suspected breakage to stay silent on.
title: >-
  the backend starts requiring 10-character titles — every flow that adds a
  task now describes a request the product refuses
mutations:
  - file: backend/validate.mjs
    search: 'return title === "" ? null : title;'
    replace: 'return title.length < 10 ? null : title;'
  - file: backend/routes/tasks.mjs
    search: 'sendJson(res, 400, { error: "Title is required" });'
    replace: 'sendJson(res, 400, { error: "Title must be at least 10 characters" });'
expect:
  audit:
    tasks/add-task:
      label: SPEC_CHANGE
      specChangeKind: BEHAVIOUR_CHANGED
    tasks/complete-task:
      label: SPEC_CHANGE
      specChangeKind: BEHAVIOUR_CHANGED
    tasks/filter-tasks:
      label: SPEC_CHANGE
      specChangeKind: BEHAVIOUR_CHANGED
  select:
    tasks/add-task: needed
    tasks/complete-task: needed
    tasks/filter-tasks: needed
    auth/login: notNeeded
    help/read-help: notNeeded
