# The guard's rejection path fires only for unauthenticated calls to the
# guarded routers, and every spec authenticates before its first guarded
# request — the pre-login session check goes through the auth router's own
# 401, untouched here. A selection that traces reachability clears every
# spec; "auth changed, re-run everything" is the false positive this case
# prices.
title: >-
  the auth guard's rejection status changes — a path no spec's flow can
  reach, so nothing needs to re-run
mutations:
  - file: server/middleware/auth.ts
    search: 'res.status(401).json({ error: "Authentication required" });'
    replace: 'res.status(403).json({ error: "Authentication required" });'
expect:
  select:
    auth/login: notNeeded
    auth/logout: notNeeded
    help/read-help: notNeeded
    projects/create-project: notNeeded
    projects/open-project: notNeeded
    settings/update-profile: notNeeded
    tasks/add-task: notNeeded
    tasks/complete-task: notNeeded
    tasks/edit-task-notes: notNeeded
    tasks/filter-tasks: notNeeded
