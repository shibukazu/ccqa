# Purely additive backend surface — a delete endpoint and its query — that no
# spec's flow ever calls.
title: a new server endpoint no spec observes — the audit must not cry wolf
mutations:
  - file: server/db/queries/tasks.ts
    search: |-
      function toTask(row: TaskRow): Task {
    replace: |-
      export function deleteTask(db: DB, id: number): void {
        db.prepare("DELETE FROM tasks WHERE id = ?").run(id);
      }

      function toTask(row: TaskRow): Task {
  - file: server/routes/tasks.ts
    search: 'import { createTask, getTask, listTasksByProject, updateTask } from "../db/queries/tasks";'
    replace: 'import { createTask, deleteTask, getTask, listTasksByProject, updateTask } from "../db/queries/tasks";'
  - file: server/routes/tasks.ts
    search: "return router;"
    replace: |-
      router.delete("/:id", (req, res) => {
          if (!getTask(db, Number(req.params.id))) {
            res.status(404).json({ error: "Task not found" });
            return;
          }
          deleteTask(db, Number(req.params.id));
          res.status(204).end();
        });

        return router;
expect:
  audit: {}
