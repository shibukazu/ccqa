# Only the spec that checks a row checkbox gains the undescribed
# confirmation step. tasks/filter-tasks never toggles a task and the task
# page's own "Done" checkbox is a different component — both stay clean.
title: >-
  completing a task now asks for confirmation — the flow gained a step the
  spec does not describe
mutations:
  - file: web/src/components/TaskRow.tsx
    search: "onChange={() => onToggle(task)}"
    replace: |-
      onChange={() => {
                if (!task.done && !window.confirm(`Mark "${task.title}" as done?`)) return;
                onToggle(task);
              }}
expect:
  audit:
    tasks/complete-task:
      label: SPEC_CHANGE
      specChangeKind: BEHAVIOUR_CHANGED
