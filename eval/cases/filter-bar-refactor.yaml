# The mutation must alter behaviour, not just shape: a semantically identical
# rewrite is defensibly `notNeeded` (the diff provably cannot change what any
# spec observes), and a strong model will say so. Here the click stops
# re-rendering the list — the event has no listener — so `needed` is earned.
title: >-
  the filter bar stops re-rendering the list on click — only the spec that
  clicks a filter button is affected
mutations:
  - file: public/js/filter.js
    search: onChange();
    replace: bar.dispatchEvent(new CustomEvent("filterchange"));
expect:
  select:
    tasks/filter-tasks: needed
    auth/login: notNeeded
    tasks/add-task: notNeeded
    tasks/complete-task: notNeeded
    help/read-help: notNeeded
