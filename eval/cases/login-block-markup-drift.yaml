# The label text "Email" is unchanged, so the block's prose stays honest and
# the drift is generated-only. help/read-help does not include the block and
# must come back clean — the fan-out has a boundary.
title: >-
  the login form's email field gets a new id — every spec including the
  login block drifts at once
mutations:
  - file: public/index.html
    search: '<label for="email">Email</label>'
    replace: '<label for="login-email">Email</label>'
  - file: public/index.html
    search: '<input id="email" name="email" type="email" autocomplete="username" required />'
    replace: '<input id="login-email" name="email" type="email" autocomplete="username" required />'
  # The app's own reference moves with the markup — the product keeps working,
  # so the only thing left stale is the generated tests' selector.
  - file: public/js/auth.js
    search: 'const email = document.getElementById("email").value;'
    replace: 'const email = document.getElementById("login-email").value;'
expect:
  audit:
    auth/login:
      label: TEST_DRIFT
      surface: generated
      subDiagnosis: SELECTOR_DRIFT
    tasks/add-task:
      label: TEST_DRIFT
      surface: generated
      subDiagnosis: SELECTOR_DRIFT
    tasks/complete-task:
      label: TEST_DRIFT
      surface: generated
      subDiagnosis: SELECTOR_DRIFT
    tasks/filter-tasks:
      label: TEST_DRIFT
      surface: generated
      subDiagnosis: SELECTOR_DRIFT
