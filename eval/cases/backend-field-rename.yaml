# api.js still reads `res.token`, so every signed-in flow breaks at run time.
# A static audit may not claim PRODUCT_BUG, and the intent the specs describe
# is unchanged — so the honest audit answer is no drift, while the selection
# must re-run everything that signs in.
title: >-
  the login response's token field is renamed in the backend only — nothing
  for the audit to report, but every signed-in flow must re-run
mutations:
  - file: backend/routes/auth.mjs
    search: 'sendJson(res, 200, { token: sessionToken });'
    replace: 'sendJson(res, 200, { accessToken: sessionToken });'
expect:
  audit: {}
  select:
    auth/login: needed
    tasks/add-task: needed
    tasks/complete-task: needed
    tasks/filter-tasks: needed
    help/read-help: notNeeded
