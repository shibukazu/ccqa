# The rule lives in shared/ and is enforced on both sides: the create form
# refuses "Marketing site" (14 characters) before any request is made, and
# the API would refuse it too. A deliberate rule — so this is SPEC_CHANGE,
# not suspected breakage. Only the spec that types a project name is
# affected; the list the other specs read goes through no validation.
title: >-
  project names are capped at 10 characters — the name the create spec
  types is now refused by both the form and the API
mutations:
  - file: shared/projects.ts
    search: "export const PROJECT_NAME_MAX = 60;"
    replace: "export const PROJECT_NAME_MAX = 10;"
expect:
  audit:
    projects/create-project:
      label: SPEC_CHANGE
      specChangeKind: BEHAVIOUR_CHANGED
  select:
    auth/login: notNeeded
    auth/logout: notNeeded
    help/read-help: notNeeded
    projects/create-project: needed
    projects/open-project: notNeeded
    settings/update-profile: notNeeded
    tasks/add-task: notNeeded
    tasks/complete-task: notNeeded
    tasks/edit-task-notes: notNeeded
    tasks/filter-tasks: notNeeded
